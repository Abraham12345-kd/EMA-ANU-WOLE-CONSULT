<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | EMA & ANU-WOLE CONSULT</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="auth-page">

        <div class="auth-box">

            <h1>EMA & ANU-WOLE CONSULT</h1>

            <h2>Reset Password</h2>

            <p>
                Enter your admin email and we'll send you a password reset link.
            </p>

            <form id="forgot-password-form">

                <label for="email">
                    Admin Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <button type="submit">
                    Send Reset Link
                </button>

            </form>

            <p id="reset-message" class="auth-message"></p>

            <a href="admin-login.html" class="auth-link">
                Back to Login
            </a>

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="forgot-password.js"></script>

</body>

</html>
