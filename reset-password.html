<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>New Password | EMA & ANU-WOLE CONSULT</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="auth-page">

        <div class="auth-box">

            <h1>EMA & ANU-WOLE CONSULT</h1>

            <h2>Create New Password</h2>

            <p>
                Enter and confirm your new admin password.
            </p>

            <form id="reset-password-form">

                <label for="new-password">
                    New Password
                </label>

                <div class="password-wrapper">
    <input
        type="password"
        id="new-password"
        placeholder="Enter new password"
        minlength="8"
        required
    >

    <button
        type="button"
        class="password-toggle"
        id="new-password-toggle"
        aria-label="Show password"
    >
        <svg
            class="eye-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
        >
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path>
            <circle cx="12" cy="12" r="3"></circle>
        </svg>
    </button>
</div>

                <label for="confirm-password">
                    Confirm Password
                </label>

                <div class="password-wrapper">
    <input
        type="password"
        id="confirm-password"
        placeholder="Confirm new password"
        minlength="8"
        required
    >

    <button
        type="button"
        class="password-toggle"
        id="confirm-password-toggle"
        aria-label="Show password"
    >
        <svg
            class="eye-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
        >
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path>
            <circle cx="12" cy="12" r="3"></circle>
        </svg>
    </button>
</div>

                <button type="submit">
                    Update Password
                </button>

            </form>

            <p id="reset-message" class="auth-message"></p>

            <a href="admin-login.html" class="auth-link">
                Back to Login
            </a>

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="reset-password.js"></script>

</body>
</html>
