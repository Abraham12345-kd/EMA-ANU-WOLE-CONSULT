<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>New Password | EMA & ANU-WOLE CONSULT</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="auth-page">

        <div class="auth-box">

            <h1>EMA & ANU-WOLE CONSULT</h1>

            <h2>Create New Password</h2>

            <p>
                Enter and confirm your new admin password.
            </p>

            <form id="reset-password-form">

                <label for="new-password">
                    New Password
                </label>

                <input
                    type="password"
                    id="new-password"
                    placeholder="Enter new password"
                    minlength="8"
                    required
                >

                <label for="confirm-password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm-password"
                    placeholder="Confirm new password"
                    minlength="8"
                    required
                >

                <button type="submit">
                    Update Password
                </button>

            </form>

            <p id="reset-message" class="auth-message"></p>

            <a href="admin-login.html" class="auth-link">
                Back to Login
            </a>

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="reset-password.js"></script>

</body>
</html>
