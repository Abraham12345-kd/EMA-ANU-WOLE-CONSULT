<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | EMA & ANU-WOLE CONSULT</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="admin-login">

        <div class="login-box">

            <h1>EMA & ANU-WOLE CONSULT</h1>

            <h2>Admin Login</h2>

            <form id="login-form">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter admin email"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >


                <button type="submit">
                    Login
                </button>

                <a href="forgot-password.html">Forgot Password?</a>

            </form>

            <p id="login-message"></p>

        </div>

    </main>


    <!-- Supabase -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="admin-login.js"></script>

</body>

</html>
